name: agro360-ci

on:
  push:
    branches: [main, "codex/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agro360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agro360_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: "true"
      AGRO360_TEST_CONNECTION_STRING: "Host=localhost;Port=5432;Database=agro360_test;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore MNSOFT.Agro360.sln
      - name: Format
        run: dotnet format MNSOFT.Agro360.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build MNSOFT.Agro360.sln --configuration Release --no-restore
      - name: Install disposable PostgreSQL baseline
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d agro360_test -f database/agro360-postgres-full.sql
      - name: Validate unique API routes
        run: python3 tools/check-api-routes.py
      - name: Validate portable database release
        working-directory: database/releases/v0.2.0
        run: |
          sha256sum --check checksums.sha256
          ! grep -nE '^\\(i|include|ir)\b' agro360-v0.2.0-full-install.sql
      - name: Validate Sprint 9 standalone SQL
        run: |
          ./scripts/validate-full-sql.sh database/agro360-postgres-full.sql
          cd database/releases/v0.6.0 && sha256sum --check checksums.sha256
      - name: Test
        run: dotnet test MNSOFT.Agro360.sln --configuration Release --no-build --report-trx --results-directory TestResults
      - name: Audit vulnerable packages
        run: dotnet list MNSOFT.Agro360.sln package --vulnerable --include-transitive
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
