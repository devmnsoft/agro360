name: mnsoft-agro360

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agro360}
      POSTGRES_USER: ${POSTGRES_USER:-agro360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-development-password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change-this-application-password}
    ports:
      - "5432:5432"
    volumes:
      - agro360-postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/010-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agro360} -d ${POSTGRES_DB:-agro360}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - agro360-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agro360}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agro360-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile.migrator
    environment:
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agro360};Username=${POSTGRES_USER:-agro360};Password=${POSTGRES_PASSWORD:-change-this-development-password};Include Error Detail=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agro360};Username=agro360_app;Password=${APP_DB_PASSWORD:-change-this-application-password};Include Error Detail=false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-change-this-key-32-bytes-minimum}
      Bootstrap__Enabled: "true"
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "8081:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ApiBaseUrl: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agro360};Username=agro360_app;Password=${APP_DB_PASSWORD:-change-this-application-password};Include Error Detail=false
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-change-this-key-32-bytes-minimum}
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  agro360-postgres:
  agro360-redis:
  agro360-minio:
